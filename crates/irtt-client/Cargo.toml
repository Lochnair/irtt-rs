[package]
name = "irtt-client"
version = "0.4.0"
description = "IRTT-compatible Rust client library"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["irtt", "networking", "latency", "rtt"]
categories = ["network-programming"]

[dependencies]
irtt-proto.workspace = true
libc = { version = "0.2.189", optional = true }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"], optional = true}

[features]
default = []
ancillary = ["dep:libc"]
tokio = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
