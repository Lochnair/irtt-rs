[package]
name = "irtt-server"
version = "0.4.0"
description = "IRTT-compatible Rust server library"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["irtt", "networking", "latency", "server"]
categories = ["network-programming"]

[dependencies]
irtt-proto.workspace = true
getrandom = "0.4.3"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

[dev-dependencies]
irtt-client = { workspace = true, features = ["ancillary", "tokio"] }
