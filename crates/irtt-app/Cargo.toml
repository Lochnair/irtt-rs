[package]
name = "irtt-rs"
version = "0.10.2"
description = "IRTT-compatible client, TUI, and server applications"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["irtt", "networking", "latency", "rtt"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "irtt_app"
doc = false

[[bin]]
name = "irtt-rs"
path = "src/bin/irtt-rs.rs"

[[bin]]
name = "irtt-client"
path = "src/bin/irtt-client.rs"
required-features = ["client"]
# This applet shares its name with the irtt-client library crate, whose rustdoc
# output it would otherwise collide with.
doc = false

[[bin]]
name = "irtt-tui"
path = "src/bin/irtt-tui.rs"
required-features = ["tui"]

[[bin]]
name = "irtt-server"
path = "src/bin/irtt-server.rs"
required-features = ["server"]
# This applet shares its name with the irtt-server library crate, whose rustdoc
# output it would otherwise collide with.
doc = false

[features]
default = ["client", "server", "tui", "stats"]
client = ["dep:clap-num", "dep:ctrlc", "dep:hex", "dep:fundu", "dep:tokio", "dep:irtt-client", "irtt-client/ancillary", "irtt-client/tokio", "dep:irtt-proto"]
stats = ["dep:irtt-stats"]
server = ["dep:ctrlc", "dep:hex", "dep:irtt-server", "dep:irtt-proto", "dep:tokio"]
tui = ["dep:clap-num", "dep:ctrlc", "dep:hex", "dep:fundu", "dep:tokio", "dep:futures-core", "dep:irtt-client", "irtt-client/ancillary", "irtt-client/tokio", "dep:irtt-proto", "stats", "dep:ratatui", "dep:crossterm", "dep:time", "dep:tz-rs"]

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
fundu = { version = "2.1.1", default-features = false, features = ["custom"], optional = true }
futures-core = { version = "0.3.34", default-features = false, optional = true }
hex = { version = "0.4.3", optional = true }
ctrlc = { version = "3.5.3", features = ["termination"], optional = true }
irtt-client = { workspace = true, optional = true }
irtt-proto = { workspace = true, optional = true }
irtt-server = { workspace = true, optional = true }
irtt-stats = { workspace = true, optional = true }
ratatui = { version = "0.30.2", optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"], optional = true }
tz-rs = { version = "0.7.3", optional = true }

# Only the Linux-family `--mark` option uses this.
[target.'cfg(any(target_os = "android", target_os = "fuchsia", target_os = "linux"))'.dependencies]
clap-num = { version = "=1.2.0", optional = true }

# The TUI clock's local offset off Unix, where tz-rs cannot find the system
# time zone. Unix keeps tz-rs: time refuses local offsets in multi-threaded
# processes there.
[target.'cfg(not(unix))'.dependencies]
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"], optional = true }

[dev-dependencies]
irtt-server.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32.0", features = ["term", "poll", "signal", "process"] }
